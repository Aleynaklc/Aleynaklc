name: Isometric Contribution Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/isocalendar.yml"

permissions:
  contents: write

concurrency:
  group: isometric-contribution-calendar
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate full-year isometric calendar
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
        with:
          filename: github-isocalendar.svg
          token: ${{ github.token }}
          user: Aleynaklc
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Europe/Istanbul
